<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazsix · Store Workspace</title>
    <meta
      name="description"
      content="พื้นที่จัดการร้าน Crazsix — สต็อกสินค้า การขาย ผ่อนชำระ และบัญชีร้าน ในที่เดียว"
    />
    <meta name="theme-color" content="#edf0f7" />
    <link rel="icon" type="image/png" href="./assets/crazsix-logo-banner.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">ข้ามไปยังเนื้อหา</a>
    <div class="wrap" id="app">
      <div class="loading">กำลังโหลดข้อมูลร้าน...</div>
    </div>

    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
      <div
        class="modal-box clay"
        role="dialog"
        aria-modal="true"
        aria-label="แจ้งเตือนและยืนยันรายการ"
        tabindex="-1"
      >
        <p id="modal-message" class="modal-message"></p>
        <div class="modal-actions">
          <button id="modal-cancel-btn" class="btn btn-ghost">ยกเลิก</button>
          <button id="modal-ok-btn" class="btn btn-primary">ตกลง</button>
        </div>
      </div>
    </div>

    <div id="detail-overlay" class="modal-overlay" aria-hidden="true">
      <div
        class="modal-box clay detail-box"
        role="dialog"
        aria-modal="true"
        aria-label="รายละเอียดสินค้า"
        tabindex="-1"
      >
        <div id="detail-body"></div>
        <div class="modal-actions" style="margin-top: 16px">
          <button id="detail-close-btn" class="btn btn-primary">ปิด</button>
        </div>
      </div>
    </div>

    <div id="edit-overlay" class="modal-overlay" aria-hidden="true">
      <div
        class="modal-box clay edit-box"
        role="dialog"
        aria-modal="true"
        aria-label="แก้ไขสินค้า"
        tabindex="-1"
      >
        <h2
          style="
            font-family: &quot;Baloo 2&quot;, sans-serif;
            margin: 0 0 14px;
            color: var(--navy);
          "
        >
          แก้ไขสินค้า
        </h2>
        <form id="edit-form">
          <div class="form-grid" style="grid-template-columns: 1fr 1fr">
            <div class="field" style="grid-column: span 2">
              <label>ชื่อสินค้า</label>
              <input type="text" name="name" required />
            </div>
            <div class="field" style="grid-column: span 2">
              <label>รูปสินค้า (แนบใหม่เพื่อแทนที่)</label>
              <input type="file" name="image" accept="image/*" />
            </div>
            <div class="field">
              <label>สี</label>
              <input type="text" name="color" />
            </div>
            <div class="field">
              <label>ไซส์</label>
              <input type="text" name="size" />
            </div>
            <div class="field" style="grid-column: span 2">
              <label>ประเภทสินค้า</label>
              <div class="type-toggle">
                <label
                  ><input type="radio" name="type" value="new" /><span
                    >มือ1</span
                  ></label
                >
                <label
                  ><input type="radio" name="type" value="used" /><span
                    >มือ2</span
                  ></label
                >
              </div>
            </div>
            <div class="field">
              <label>จำนวนคงเหลือ</label>
              <input type="number" name="qty" min="0" required />
            </div>
            <div class="field">
              <label>ราคาต้นทุน/ชิ้น</label>
              <input type="number" name="cost" min="0" step="0.01" required />
            </div>
            <div class="field" style="grid-column: span 2">
              <label>ราคาที่ตั้งใจขาย (โน้ต)</label>
              <input type="number" name="price" min="0" step="0.01" required />
            </div>
          </div>
          <div class="modal-actions" style="margin-top: 16px">
            <button type="button" id="edit-cancel-btn" class="btn btn-ghost">
              ยกเลิก
            </button>
            <button type="submit" class="btn btn-primary">
              บันทึกการแก้ไข
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="payment-overlay" class="modal-overlay" aria-hidden="true">
      <div
        class="modal-box clay"
        role="dialog"
        aria-modal="true"
        aria-label="รับชำระเงินเพิ่ม"
        tabindex="-1"
      >
        <h2
          style="
            font-family: &quot;Baloo 2&quot;, sans-serif;
            margin: 0 0 10px;
            color: var(--navy);
          "
        >
          รับชำระเงินเพิ่ม
        </h2>
        <p id="payment-info" class="hint" style="margin-top: 0"></p>
        <div class="field">
          <label>จำนวนเงินที่รับ</label>
          <input type="number" id="payment-amount" min="0" step="0.01" />
        </div>
        <div class="modal-actions" style="margin-top: 16px">
          <button type="button" id="payment-cancel-btn" class="btn btn-ghost">
            ยกเลิก
          </button>
          <button type="button" id="payment-submit-btn" class="btn btn-primary">
            บันทึกการรับชำระ
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/ui-accessibility.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
